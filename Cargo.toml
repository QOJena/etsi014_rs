[package]
name = "etsi014"
version = "0.2.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.htm

[dependencies]
reqwest = { version = "0.12.20", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
http = "1.3.1"
env_logger = "0.11.8"
log = "0.4.27"
anyhow = "1.0.98"


[dev-dependencies]
tokio = { version = "1.45.1", features = ["full"] }
tokio-test = "0.4.4"

[features]
default = ["blocking"]
blocking = []


