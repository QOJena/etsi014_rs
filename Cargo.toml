[package]
name = "etsi014"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "Client for the ETSI GS QKD 014 key delivery REST API"
license = "MIT"
repository = "https://github.com/QOJena/etsi014_rs"
readme = "README.md"
keywords = ["qkd", "etsi", "quantum", "key-management", "cryptography"]

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
thiserror = "2.0.21"
url = "2.5.8"


[dev-dependencies]
env_logger = "0.11.11"
tokio = { version = "1.53.2", features = ["full"] }
tokio-test = "0.4.6"
rcgen = "0.14.10"

[features]
default = ["types"]
blocking = ["reqwest/blocking"]
types = []


# [[example]]
# name = "async_tls"
# path = "examples/async_tls.rs"
# features = [""]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
