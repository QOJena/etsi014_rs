[package]
name = "etsi014"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.htm

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
http = "1.5.0"
env_logger = "0.11.11"
log = "0.4.34"
anyhow = "1.0.104"
thiserror = "2.0.21"
url = "2.5.8"


[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-test = "0.4.5"

[features]
default = ["blocking"]
blocking = []


