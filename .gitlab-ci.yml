stages: [build, test, docs, deploy]

variables:
  RUST_VERSION: "1.82"
  CARGO_HOME: "/usr/local/cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  CARGO_TERM_COLOR: "always"

default:
  image: "rust:${RUST_VERSION}"
  before_script:
    - rustc -V && cargo -V
    - rustup component add clippy rustfmt
  cache:
    key:
      files: [Cargo.lock]
    paths:
      - "${CARGO_HOME}/registry"
      - "${CARGO_HOME}/git"
      - "target"

build:
  stage: build
  script:
    - cargo build --workspace --all-targets --locked --verbose
  # No artifacts here!

test:
  stage: test
  needs: [build]
  script:
    - cargo test --workspace --locked --verbose
  artifacts:
    when: always
    reports:
      junit: target/junit.xml   # generate this if you want it
  # DO NOT include `paths: - target` here

docs:
  stage: docs
  script:
    - cargo doc --workspace --no-deps --locked
    - rm -rf public && mkdir public
    - mv target/doc public/
    # tiny index redirect to first crate
    - |
      CRATE_INDEX="$(ls public | head -n1)"
      printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=./%s/index.html">' "$CRATE_INDEX" > public/index.html
  artifacts:
    paths: [public]   # only publish docs

pages:
  stage: deploy
  needs: [docs]
  script: [ 'echo "Publishing docs..."' ]
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
